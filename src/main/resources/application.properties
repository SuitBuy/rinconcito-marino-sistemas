spring.application.name=rinconcito-marino
spring.profiles.default=local
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rinconcito_marino?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-rinconcito-marino-2026-very-private}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.security.cookie-name=${JWT_COOKIE_NAME:RM_TOKEN}
app.security.cookie-secure=${JWT_COOKIE_SECURE:false}
app.restaurant.whatsapp-number=${WHATSAPP_NUMBER:}
app.restaurant.reservation-fee=${RESERVATION_FEE:20.00}
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.bootstrap.user=${ADMIN_USER:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
app.admin.bootstrap.role=${ADMIN_ROLE:ADMIN}

app.notifications.from=${MAIL_FROM:no-reply@rinconcitomarino.local}
app.notifications.opinions.enabled=${OPINION_EMAIL_ENABLED:false}
app.notifications.opinions.to=${OPINION_EMAIL_TO:}
