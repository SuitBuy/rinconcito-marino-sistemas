<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Personal - Rinconcito Marino</title>
    <link rel="icon" type="image/png" th:href="@{/assets/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260608-cache-reset')}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark bg-opacity-75 site-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <img th:src="@{/assets/logo.png}" alt="Rinconcito Marino">
            <span class="fw-semibold">Rinconcito Marino</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/carta}">Carta</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reservas}">Reservas</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/login}">Personal</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="login-screen">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="brand-panel p-4 p-md-5">
                    <div class="text-center mb-4">
                        <img th:src="@{/assets/logo.png}" alt="Rinconcito Marino" style="height: 84px">
                        <h1 class="h3 fw-bold mt-3">Acceso Personal</h1>
                        <p class="text-secondary mb-0">Dashboard de reservas y opiniones</p>
                    </div>

                    <div class="alert alert-danger" th:if="${loginError}">
                        Usuario o contrasena incorrectos.
                    </div>
                    <div class="alert alert-warning" th:if="${sessionExpired}">
                        Inicia sesion para acceder al panel administrativo.
                    </div>

                    <form th:action="@{/login}" th:object="${loginRequest}" method="post" class="row g-3">
                        <div class="col-12">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input th:field="*{usuario}" type="text" class="form-control form-control-lg" autocomplete="username" required>
                        </div>
                        <div class="col-12">
                            <label for="password" class="form-label">Contrasena</label>
                            <input th:field="*{password}" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
                        </div>
                        <div class="col-12 d-grid">
                            <button type="submit" class="btn btn-rm btn-lg">Ingresar</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/}" class="link-secondary text-decoration-none">Volver a la web</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
