spring.datasource.url=${LOCAL_DB_URL:jdbc:mysql://127.0.0.1:3306/rinconcito_marino?serverTimezone=America/Lima&allowPublicKeyRetrieval=true&sslMode=DISABLED}
spring.datasource.username=${LOCAL_DB_USER:rinconcito}
